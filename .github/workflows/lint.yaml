name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck run.sh
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./twingate-connector
          ignore_paths: >-
            twingate-connector/healthd.py

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile healthd
        run: python3 -m py_compile twingate-connector/healthd.py
