name: Twingate Connector
description: Keeps a Twingate Connector online so you can reach your home network securely
version: "1.0.0"
slug: twingate_connector
url: https://github.com/chancemcox/Homeassistant-twingate/tree/main/twingate-connector
init: false
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
host_network: true
hassio_api: true
privileged:
  - NET_ADMIN
  - NET_RAW
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-lock-outline
panel_title: Twingate
watchdog: http://[HOST]:[PORT:8099]/health
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Health status page (optional; ingress is preferred)
options:
  network: ""
  access_token: ""
  refresh_token: ""
  log_level: info
  log_analytics: true
  dns: ""
  health_interval: 60
  restart_delay: 5
  max_restart_delay: 300
schema:
  network: str
  access_token: password
  refresh_token: password
  log_level: list(error|warning|info|debug)
  log_analytics: bool
  dns: str?
  health_interval: int(15,600)
  restart_delay: int(1,120)
  max_restart_delay: int(30,3600)
